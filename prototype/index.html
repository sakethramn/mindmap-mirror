<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Emotion Tracker Prototype</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <h1>🧪 Emotion Tracker Prototype</h1>
  <p>Concept Demonstration – Timeline & Emotional Awareness</p>
</header>

<main>

  <section class="card">
    <h2>Log Emotion</h2>

    <label>Emotion</label>
    <select id="emotion">
      <option value="happy">Happy</option>
      <option value="calm">Calm</option>
      <option value="stressed">Stressed</option>
      <option value="sad">Sad</option>
      <option value="angry">Angry</option>
    </select>

    <label>Intensity (1–10)</label>
    <input type="range" id="intensity" min="1" max="10" value="5">
    <div class="range-value" id="intensityValue">5</div>

    <label>Notes</label>
    <textarea id="notes"></textarea>

    <button onclick="saveEmotion()">Save Emotion</button>
  </section>

  <section class="card wide">
    <h2>Emotion Timeline</h2>

    <canvas id="timeline"></canvas>

    <div class="timeline-controls">
      <label>From</label>
      <input type="date" id="startDate">

      <label>To</label>
      <input type="date" id="endDate">

      <button onclick="filterTimeline()">View Period</button>
      <button class="danger" onclick="clearTimeline()">Clear Timeline</button>
    </div>
  </section>

</main>

<footer>
  <p>Prototype Version • Concept Demonstration</p>
</footer>

<script src="script.js"></script>
</body>
</html>
